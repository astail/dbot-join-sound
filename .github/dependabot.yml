version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # prism-media（@discordjs/voice 経由）が peerDependencies で ^0.0.8 を要求している。
      # 対応したら外す
      - dependency-name: opusscript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Dockerfile と compose.yaml のイメージ（digest 固定）を更新する
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # 奇数版（LTS にならない）も提案されるため、Node のメジャー更新は LTS に合わせて手で行う
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
