services:
  bot:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    init: true
    restart: unless-stopped
    depends_on:
      - voicevox
      - piper
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN must be set in .env}
      JOIN_SOUND_ENABLED: ${JOIN_SOUND_ENABLED:-true}
      PLAYBACK_VOLUME: ${PLAYBACK_VOLUME:-0.4}
      JOIN_SOUND_FADE_IN_MS: ${JOIN_SOUND_FADE_IN_MS:-1000}
      ANNOUNCE_DELAY_MS: ${ANNOUNCE_DELAY_MS:-500}
      VC_CHAT_READ_ENABLED: ${VC_CHAT_READ_ENABLED:-true}
      VC_CHAT_DELETE_SECONDS: ${VC_CHAT_DELETE_SECONDS:-30}
      VOICEVOX_VOLUME: ${VOICEVOX_VOLUME:-0.8}
      VOICEVOX_URL: ${VOICEVOX_URL:-http://voicevox:50021}
      VOICEVOX_SPEAKER: ${VOICEVOX_SPEAKER:-14}
      VOICEVOX_TIMEOUT_MS: ${VOICEVOX_TIMEOUT_MS:-10000}
      PIPER_URL: ${PIPER_URL:-http://piper:5000}
    volumes:
      - sounds:/app/sounds

  # 未登録ユーザーの入室読み上げ用。ポートは公開せず bot からのみ参照する
  voicevox:
    image: voicevox/voicevox_engine:cpu-0.26.1@sha256:46fe4ddaef27e8bfc2ff4f9709d27f3e38e295d405c5f9351d7c62056e0b4ca7
    init: true
    restart: unless-stopped
    environment:
      # 既定（0 = 自動）だと 1 コアしか使わず、合成が遅いため
      VV_CPU_NUM_THREADS: ${VOICEVOX_CPU_NUM_THREADS:-4}

  # 韓国語の読み上げ用。VOICEVOX と同じくポートは公開しない
  piper:
    build: ./piper
    init: true
    restart: unless-stopped

volumes:
  sounds:
